<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEROMECH - Recupero Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/stile.css">
</head>
<body class="bg-gray-100 font-sans text-gray-900 flex items-center justify-center min-h-screen">

    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-8 border border-gray-200">
        <div class="text-center mb-6">
            <div class="bg-emerald-800 text-white p-3 rounded-xl inline-block mb-3">
                <i data-lucide="key-round" class="w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-black text-gray-900">Recupero Credenziali</h1>
            <p class="text-xs text-gray-500 mt-1">Inserisci la tua email e imposta una nuova password di accesso.</p>
        </div>

        <form id="form-recupero" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email di Registrazione</label>
                <input type="email" id="rec-email" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm outline-none focus:border-emerald-600" placeholder="es. michele@azienda.it">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nuova Password</label>
                <input type="password" id="rec-nuova-password" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm outline-none focus:border-emerald-600" placeholder="Minimo 6 caratteri">
            </div>

            <button type="submit" class="w-full bg-emerald-800 hover:bg-emerald-950 text-white font-bold py-3 rounded-lg text-sm shadow transition cursor-pointer mt-2">
                Aggiorna Password
            </button>
        </form>

        <div class="mt-6 text-center border-t pt-4">
            <a href="accesso.html" class="text-xs font-bold text-emerald-800 hover:underline flex items-center justify-center">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5 mr-1"></i> Torna alla schermata di Login
            </a>
        </div>
    </div>

    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();

        document.getElementById('form-recupero').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('rec-email').value.trim();
            const nuovaPassword = document.getElementById('rec-nuova-password').value.trim();

            // 1. Leggiamo lo stesso identico database usato dal login
            let utenti = JSON.parse(localStorage.getItem('databaseOperatori')) || [];

            // 2. Cerchiamo l'utente ignorando maiuscole/minuscole nell'email
            const indiceUtente = utenti.findIndex(utente => utente.email.toLowerCase() === email.toLowerCase());

            if (indiceUtente !== -1) {
                // Utente trovato! Aggiorniamo la password
                utenti[indiceUtente].password = nuovaPassword;

                // 3. Salviamo la lista aggiornata nel database globale
                localStorage.setItem('databaseOperatori', JSON.stringify(utenti));

                alert("Password aggiornata con successo! Ora puoi effettuare l'accesso.");
                window.location.href = 'accesso.html';
            } else {
                alert("Errore: Nessun account trovato con l'indirizzo email inserito. Verifica l'email.");
            }
        });
    </script>
</body>
</html>
