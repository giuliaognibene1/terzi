<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGROMECH - Accesso Operatore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-100 font-sans text-gray-900 flex items-center justify-center min-h-screen p-4 relative">

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden z-10">
        <div class="bg-sidebar p-8 text-center border-b-4 border-orange-500">
            <div class="bg-orange-500 text-white p-3 rounded-full inline-flex items-center justify-center mb-4 shadow-lg">
                <i data-lucide="tractor" class="w-8 h-8"></i>
            </div>
            <h1 class="font-black text-white tracking-wide text-3xl leading-none">AGROMECH</h1>
            <span class="text-xs text-emerald-400 font-bold tracking-widest uppercase mt-1 block">App Operativa</span>
        </div>

        <form id="form-login" class="p-6 space-y-5">
            <div id="errore-login" class="nascosto bg-red-50 text-red-700 text-xs font-bold p-3 rounded-lg border border-red-200 text-center flex items-center justify-center space-x-2">
                <i data-lucide="alert-circle" class="w-4 h-4"></i>
                <span>Email o password errate.</span>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1.5 ml-1">Email Operatore</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i data-lucide="mail" class="w-5 h-5"></i></span>
                    <input type="email" id="login-email" required placeholder="mario.rossi@aeromech.it" class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl bg-gray-50 text-sm font-medium outline-none focus:border-emerald-600 focus:bg-white focus:ring-2 focus:ring-emerald-100 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1.5 ml-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i data-lucide="lock" class="w-5 h-5"></i></span>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl bg-gray-50 text-sm font-medium outline-none focus:border-emerald-600 focus:bg-white focus:ring-2 focus:ring-emerald-100 transition">
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-3.5 rounded-xl text-sm shadow-md transition cursor-pointer flex justify-center items-center space-x-2">
                    <span>Accedi al Turno</span>
                    <i data-lucide="log-in" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="text-center pt-4">
                <a href="index.html" class="text-[11px] text-gray-400 hover:text-emerald-700 font-bold uppercase transition cursor-pointer underline">Accesso Amministratore</a>
            </div>
        </form>
    </div>

    <script src="assets/js/login.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });
    </script>
</body>
</html>
