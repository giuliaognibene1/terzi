<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AEROMECH - App Operatore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/stile.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-verde-scuro: #0f2a1d;
        }
        .bg-tema-scuro { background-color: var(--bg-verde-scuro); }
        body { padding-bottom: 75px; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900">

    <header class="bg-tema-scuro text-white p-4 shadow-md sticky top-0 z-40 flex justify-between items-center max-w-md mx-auto">
        <div class="flex items-center space-x-2">
            <div class="bg-orange-500 p-1.5 rounded"><i data-lucide="tractor" class="w-6 h-6"></i></div>
            <h1 class="font-black tracking-wide text-xl">AEROMECH</h1>
        </div>
        <div class="text-right">
            <p class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">Operatore</p>
            <p id="nome-operatore" class="text-sm font-bold truncate max-w-[120px]"></p>
        </div>
    </header>

    <div class="bg-white border-b border-gray-200 sticky top-[68px] z-30 shadow-sm max-w-md mx-auto flex">
        <button id="tab-oggi" class="flex-1 text-center py-3.5 font-bold text-xs border-b-2 border-emerald-800 text-emerald-800 outline-none cursor-pointer flex items-center justify-center space-x-1">
            <i data-lucide="calendar" class="w-3.5 h-3.5"></i><span>Oggi</span>
        </button>
        <button id="tab-futuri" class="flex-1 text-center py-3.5 font-bold text-xs border-b-2 border-transparent text-gray-500 hover:text-gray-700 outline-none cursor-pointer flex items-center justify-center space-x-1">
            <i data-lucide="calendar-days" class="w-3.5 h-3.5"></i><span>Prossimi</span>
        </button>
        <button id="tab-passati" class="flex-1 text-center py-3.5 font-bold text-xs border-b-2 border-transparent text-gray-500 hover:text-gray-700 outline-none cursor-pointer flex items-center justify-center space-x-1">
            <i data-lucide="archive" class="w-3.5 h-3.5"></i><span>Finiti</span>
        </button>
    </div>

    <main class="p-4 max-w-md mx-auto space-y-4">
        <div id="sezione-oggi" class="space-y-4"></div>
        <div id="sezione-futuri" class="space-y-4" style="display: none;"></div>
        <div id="sezione-passati" class="space-y-4" style="display: none;"></div>
    </main>

    <div id="modale-chiusura" style="display: none;" class="fixed inset-0 bg-gray-900 bg-opacity-80 items-end justify-center z-50 p-4 pb-20">
        <div class="bg-white rounded-t-2xl shadow-2xl w-full max-w-md overflow-hidden relative p-5 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 mb-4 sticky top-0 bg-white z-10">
                <h3 class="text-lg font-black text-gray-900">Rapporto Fine Lavoro</h3>
                <button type="button" id="btn-annulla-chiusura" class="text-gray-400 hover:text-red-500 cursor-pointer"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>

            <input type="hidden" id="chiudi-id-cantiere">

            <div class="space-y-5">
                <div class="bg-blue-50 p-3 rounded-lg border border-blue-100 flex items-start space-x-2">
                    <i data-lucide="info" class="w-4 h-4 text-blue-600 mt-0.5 flex-shrink-0"></i>
                    <p class="text-xs text-blue-800 font-medium leading-tight">Compila i dati reali del turno per permettere all'amministrazione di calcolare i costi e la fatturazione esatta.</p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Ore Reali Lavorate *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i data-lucide="clock" class="w-5 h-5"></i></span>
                        <input type="number" step="0.5" id="chiudi-ore" placeholder="Es. 3.5" class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl bg-gray-50 text-sm outline-none focus:border-emerald-600 focus:bg-white focus:ring-2 focus:ring-emerald-100 font-bold text-gray-900" required>
                    </div>
                </div>

                <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 space-y-4">
                    <h4 class="text-[10px] uppercase font-black text-gray-400 tracking-wider flex items-center">
                        <i data-lucide="gauge" class="w-3.5 h-3.5 mr-1.5"></i> Dati Telemetria Macchina (Opzionali)
                    </h4>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-600 uppercase mb-1">Litri Gasolio</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-2.5 text-gray-400"><i data-lucide="fuel" class="w-4 h-4"></i></span>
                                <input type="number" step="1" id="chiudi-litri" placeholder="Es. 120" class="w-full pl-8 pr-2 py-2 border border-gray-300 rounded-lg bg-white text-sm outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-100 font-bold">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-600 uppercase mb-1">Lettura Contaore</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-2.5 text-gray-400"><i data-lucide="hash" class="w-4 h-4"></i></span>
                                <input type="number" step="1" id="chiudi-contaore" placeholder="Es. 4500" class="w-full pl-8 pr-2 py-2 border border-gray-300 rounded-lg bg-white text-sm outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-100 font-bold">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-gray-600 uppercase mb-1">Km Percorsi (solo furgoni/camion)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-2.5 text-gray-400"><i data-lucide="map" class="w-4 h-4"></i></span>
                            <input type="number" step="1" id="chiudi-km" placeholder="Es. 45" class="w-full pl-8 pr-2 py-2 border border-gray-300 rounded-lg bg-white text-sm outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-100 font-bold">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Note Operative / Problemi</label>
                    <textarea id="chiudi-note" rows="3" placeholder="Scrivi note particolari o problemi riscontrati sul campo..." class="w-full px-3 py-3 border border-gray-300 rounded-xl bg-gray-50 text-sm outline-none focus:border-emerald-600 focus:bg-white focus:ring-2 focus:ring-emerald-100"></textarea>
                </div>

                <div class="pt-2">
                    <button type="button" id="btn-salva-chiusura" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-black py-4 rounded-xl text-base shadow-lg active:scale-95 transition flex justify-center items-center space-x-2 cursor-pointer">
                        <i data-lucide="check-circle" class="w-5 h-5"></i>
                        <span>Invia e Chiudi Cantiere</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around pb-safe z-40 max-w-md left-1/2 transform -translate-x-1/2 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <div class="flex-1 py-3 flex flex-col items-center text-emerald-700 font-bold">
            <i data-lucide="list-todo" class="w-6 h-6 mb-1"></i>
            <span class="text-[10px] uppercase tracking-wider">Miei Turni</span>
        </div>
        <button id="btn-logout" class="flex-1 py-3 flex flex-col items-center text-gray-400 hover:text-red-600 active:text-red-600 transition cursor-pointer">
            <i data-lucide="log-out" class="w-6 h-6 mb-1"></i>
            <span class="text-[10px] uppercase tracking-wider">Esci</span>
        </button>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="assets/js/operatore.js"></script>
    <script>
        // Inizializzazione icone fisse all'apertura
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
</body>
</html>
